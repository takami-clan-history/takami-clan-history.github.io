            border-bottom: 2px solid #ccc;
            padding-bottom: 5px;
            font-size: 1.2rem;
        }

        /* 画像グリッド（一覧用） */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        .grid img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .grid img:hover {
            transform: scale(1.03);
        }

        /* モーダル（詳細画像表示用） */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }
        #modal img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 4px;
        }
        #modal.active {
            display: flex;
        }

        <h2>カテゴリ名 1</h2>
        <div class="grid">
            <!-- thumbs（一覧用）をクリックすると originals（詳細用）の画像モーダルが開く -->
            <img src="category1/thumbs/img01.jpg" data-full="category1/originals/img01.jpg" alt="画像1">
            <img src="category1/thumbs/img02.jpg" data-full="category1/originals/img02.jpg" alt="画像2">
        </div>
    </div>

    <!-- カテゴリ2 -->
    <div class="category-section">
        <h2>カテゴリ名 2</h2>
        <div class="grid">
            <img src="category2/thumbs/img01.jpg" data-full="category2/originals/img01.jpg" alt="画像A">
        </div>
    </div>

    <!-- 詳細表示用モーダル -->
    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="詳細画像">
    </div>

    <script>
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const images = document.querySelectorAll('.grid img');

        images.forEach(img => {
            img.addEventListener('click', () => {
                const fullSrc = img.getAttribute('data-full');
                modalImg.src = fullSrc;
                modal.classList.add('active');
            });
        });

        function closeModal() {
            modal.classList.remove('active');
            modalImg.src = '';
        }
    </script>
